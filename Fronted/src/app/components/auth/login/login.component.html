<section class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Iniciar sesion</mat-card-title>
      <mat-card-subtitle>Accede para gestionar tus proyectos y tareas</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-stack">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
          <mat-error *ngIf="form.controls.email.hasError('required')">El email es obligatorio</mat-error>
          <mat-error *ngIf="form.controls.email.hasError('email')">Ingresa un email valido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contrasena</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password">
          <mat-error *ngIf="form.controls.password.hasError('required')">La contrasena es obligatoria</mat-error>
        </mat-form-field>

        <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading">
          <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
          <span *ngIf="!loading">Entrar</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <a mat-button routerLink="/registro">Crear cuenta</a>
    </mat-card-actions>
  </mat-card>
</section>
